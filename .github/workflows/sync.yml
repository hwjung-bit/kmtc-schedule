name: KMTC Schedule Sync

on:
  schedule:
    # Frequent run — next 30 days only, no voyage discovery
    - cron: '0 */2 * * *'
    # Daily wide sweep — 90-day horizon + new voyage discovery (05:40 KST)
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - daily
          - full
          - single
          - routes
      vessel_code:
        description: 'Vessel code (for single mode only)'
        required: false
        default: ''

# The gateway meters total request volume — overlapping runs starve
# each other, so queue instead of running side by side.
concurrency:
  group: kmtc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: sync
        run: npm install

      - name: Run sync
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KMTC_API_URL: 'http://apigateway.ekmtc.com/gateway/vesselSchedule/v1/events'
          KMTC_API_KEY: ${{ secrets.KMTC_API_KEY }}
          SYNC_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '40 20 * * *' && 'daily' || 'incremental') }}
          VESSEL_CODE: ${{ github.event.inputs.vessel_code || '' }}
        run: node index.js
