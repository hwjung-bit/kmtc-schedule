name: KMTC Schedule Sync

on:
  schedule:
    # Frequent run — active voyages within 30 days, no voyage discovery
    - cron: '0 */2 * * *'
    # Daily wide sweep — 45-day horizon + discovery + route sync (05:40 KST)
    - cron: '40 20 * * *'
    # Extra wide sweeps after KMTC office-hour revisions (12:40 / 19:40 KST)
    - cron: '40 3 * * *'
    - cron: '40 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - daily
          - wide
          - longrange
          - full
          - single
          - routes
          - routes-backfill
      vessel_code:
        description: 'Vessel code (single), or comma list to limit wide/longrange'
        required: false
        default: ''

# The gateway meters total request volume — overlapping runs starve
# each other, so queue instead of running side by side.
concurrency:
  group: kmtc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Wide sweeps take ~90 min under gateway throttling and the weekly
    # long-range sweep about twice that; leave headroom.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: sync
        run: npm install

      - name: Run sync
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KMTC_API_URL: 'http://apigateway.ekmtc.com/gateway/vesselSchedule/v1/events'
          KMTC_API_KEY: ${{ secrets.KMTC_API_KEY }}
          SYNC_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '40 20 * * *' && 'daily') || (github.event.schedule == '0 13 * * 6' && 'longrange') || ((github.event.schedule == '40 3 * * *' || github.event.schedule == '40 10 * * *') && 'wide') || 'incremental' }}
          VESSEL_CODE: ${{ github.event.inputs.vessel_code || '' }}
        run: node index.js
